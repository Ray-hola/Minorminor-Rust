name: macOS build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          sw_vers
          uname -m
      - name: Core tests
        run: cargo test --locked --manifest-path native/Cargo.toml --no-default-features
      - name: Build application
        run: ./scripts/build-macos.sh
      - name: Packaged application smoke test
        run: python3 scripts/test-native-smoke.py
      - name: Package application
        run: ditto -c -k --keepParent dist/Minorminor.app dist/Minorminor-macos.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Minorminor-macos-${{ runner.arch }}
          path: dist/Minorminor-macos.zip
          if-no-files-found: error
          retention-days: 7
